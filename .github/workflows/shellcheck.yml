name: ShellCheck

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/shellcheck.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - '.github/workflows/shellcheck.yml'

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: scripts
